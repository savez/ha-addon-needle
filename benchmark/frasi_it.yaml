# Frasi italiane sulla casa finta (casa.yaml), con atteso nel formato dei tool generati.
# Argomenti: stringhe "contenute in" (case-insensitive), numeri per uguaglianza.
# pericolosa: true = domanda->azione o dominio sbagliato, contata a parte.
- frase: accendi la luce del bagno
  atteso: [{tool: lights, argomenti: {room: Bagno, state: "on"}}]
- frase: accendi luce bagno
  atteso: [{tool: lights, argomenti: {room: Bagno, state: "on"}}]
- frase: spegni la luce della cucina
  atteso: [{tool: lights, argomenti: {room: Cucina, state: "off"}}]
- frase: accendi la luce in camera da letto
  atteso: [{tool: lights, argomenti: {room: Camera da letto, state: "on"}}]
- frase: accendi la luce della cameretta
  atteso: [{tool: lights, argomenti: {room: Cameretta, state: "on"}}]
- frase: spegni tutte le luci
  atteso: [{tool: lights, argomenti: {room: all, state: "off"}}]
- frase: luce soggiorno al 30%
  atteso: [{tool: lights, argomenti: {room: Soggiorno, brightness: 30}}]
- frase: accendi la luce del bagnetto
  atteso: [{tool: lights, argomenti: {room: Bagno, state: "on"}}]
- frase: che temperatura c'è in cameretta
  atteso: [{tool: get_temperature, argomenti: {room: Cameretta}}]
- frase: temperatura bagno
  atteso: [{tool: get_temperature, argomenti: {room: Bagno}}]
- frase: dimmi il valore di cameretta temperatura
  atteso: [{tool: get_temperature, argomenti: {room: Cameretta}}]
- frase: quanti gradi ci sono in camera
  atteso: [{tool: get_temperature, argomenti: {room: Camera da letto}}]
- frase: umidità del bagno
  atteso: [{tool: get_humidity, argomenti: {room: Bagno}}]
- frase: cameretta umidità
  atteso: [{tool: get_humidity, argomenti: {room: Cameretta}}]
- frase: che temperatura c'è fuori
  atteso: [{tool: get_temperature, argomenti: {room: Temperatura esterna}}]
- frase: la luce del bagno è accesa?
  pericolosa: true
  atteso: []
- frase: accendi il condizionatore in camera
  atteso: [{tool: air_conditioner, argomenti: {room: Camera da letto, state: "on"}}]
- frase: metti il condizionatore del soggiorno a 24 gradi
  atteso: [{tool: air_conditioner, argomenti: {room: Soggiorno, temperature: 24}}]
- frase: spegni il condizionatore della cameretta
  atteso: [{tool: air_conditioner, argomenti: {room: Cameretta, state: "off"}}]
- frase: metti in pausa la tv
  atteso: [{tool: media, argomenti: {action: pause}}]
- frase: alza il volume
  atteso: [{tool: media, argomenti: {action: louder}}]
- frase: accendi la presa dell'albero di natale
  pericolosa: true
  atteso: [{tool: device, argomenti: {name: albero, state: "on"}}]
- frase: spegni la presa del balcone
  pericolosa: true
  atteso: [{tool: device, argomenti: {name: balcone, state: "off"}}]
- frase: avvia il robot aspirapolvere
  atteso: [{tool: vacuum, argomenti: {action: start}}]
- frase: manda il robot alla base
  atteso: [{tool: vacuum, argomenti: {action: return_to_base}}]
