# Frasi italiane per il benchmark. Adatta i nomi ai dispositivi esposti in casa.
# Argomenti: stringhe "contenute in" (case-insensitive), numeri per uguaglianza.

# --- comandi standard (prima li capiva l'agente di HA) ---
- frase: accendi la luce del bagno
  atteso: [{tool: HassTurnOn, argomenti: {name: bagno}}]
- frase: spegni la luce della cucina
  atteso: [{tool: HassTurnOff, argomenti: {name: cucina}}]
- frase: spegni tutte le luci del salotto
  atteso: [{tool: HassTurnOff, argomenti: {area: salotto}}]
- frase: accendi il ventilatore dello studio
  atteso: [{tool: HassTurnOn, argomenti: {name: ventilatore}}]
- frase: apri la tapparella della cucina
  atteso: [{tool: HassTurnOn, argomenti: {name: tapparella}}]
- frase: chiudi le tapparelle del salotto
  atteso: [{tool: HassTurnOff, argomenti: {area: salotto}}]
- frase: metti la tapparella della camera al 30%
  atteso: [{tool: HassSetPosition, argomenti: {position: 30}}]
- frase: metti la luce del soggiorno al 50%
  atteso: [{tool: HassLightSet, argomenti: {brightness: 50}}]
- frase: imposta la luminosità della cucina all'80 per cento
  atteso: [{tool: HassLightSet, argomenti: {brightness: 80}}]
- frase: fai la luce del salotto rossa
  atteso: [{tool: HassLightSet, argomenti: {color: ros}}]
- frase: imposta il termostato a 21 gradi
  atteso: [{tool: HassClimateSetTemperature, argomenti: {temperature: 21}}]
- frase: metti il riscaldamento in camera a 19 gradi
  atteso: [{tool: HassClimateSetTemperature, argomenti: {temperature: 19}}]
- frase: metti in pausa la musica
  atteso: [{tool: HassMediaPause}]
- frase: riprendi la musica in salotto
  atteso: [{tool: HassMediaUnpause}]
- frase: imposta il volume della cucina al 40
  atteso: [{tool: HassSetVolume, argomenti: {volume_level: 40}}]
- frase: imposta un timer di 10 minuti
  atteso: [{tool: HassStartTimer, argomenti: {minutes: 10}}]

# --- formulazioni libere ---
- frase: per favore potresti accendere la luce in bagno
  atteso: [{tool: HassTurnOn, argomenti: {name: bagno}}]
- frase: in cucina c'è troppo buio
  atteso: [{tool: HassTurnOn}]
- frase: non mi serve più la luce del salotto
  atteso: [{tool: HassTurnOff}]

# --- azioni multiple ---
- frase: spegni la luce del bagno e accendi quella della cucina
  atteso: [{tool: HassTurnOff, argomenti: {name: bagno}}, {tool: HassTurnOn, argomenti: {name: cucina}}]
- frase: chiudi le tapparelle e spegni le luci del salotto
  atteso: [{tool: HassTurnOff}, {tool: HassTurnOff}]

# --- domande di stato ---
- frase: la luce del bagno è accesa?
  atteso: [{tool: GetLiveContext}]
- frase: quanti gradi ci sono in camera?
  atteso: [{tool: GetLiveContext}]
- frase: è aperta la porta del garage?
  atteso: [{tool: GetLiveContext}]

# --- condizionali ---
- frase: se la temperatura del bagno è sopra 50 spegni la luce del bagno
  passi:
    - atteso: [{tool: GetLiveContext}]
      risultato: '[{"tool": "GetLiveContext", "data": {"result": "Live Context: An overview of the areas and the devices in this smart home:\n- names: Temperatura bagno\n  domain: sensor\n  state: ''55''\n  attributes:\n    unit_of_measurement: °C\n"}, "error": false}]'
    - atteso: [{tool: HassTurnOff, argomenti: {name: bagno}}]
- frase: se la temperatura del bagno è sopra 50 spegni la luce del bagno
  passi:
    - atteso: [{tool: GetLiveContext}]
      risultato: '[{"tool": "GetLiveContext", "data": {"result": "Live Context: An overview of the areas and the devices in this smart home:\n- names: Temperatura bagno\n  domain: sensor\n  state: ''21''\n  attributes:\n    unit_of_measurement: °C\n"}, "error": false}]'
    - atteso: []

